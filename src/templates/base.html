<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>스마트보카</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('home') }}" class="brand"><span class="brand-mark">S</span>스마트보카</a>
    <nav>
      <a href="{{ url_for('study') }}">학습</a>
      <a href="{{ url_for('words_page') }}">단어 관리</a>
      <a href="{{ url_for('report_page') }}">학습 기록</a>
    </nav>
  </header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash {{ category }}">{{ '!' if category == 'error' else '✓' }} {{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
