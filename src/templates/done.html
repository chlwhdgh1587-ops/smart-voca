{% extends "base.html" %}
{% block content %}
<section class="card done">
  <div class="emoji">🎉</div>
  <h1>오늘의 학습 완료</h1>
  <p class="muted">수고했어요. 틀린 단어는 다음 복습에서 다시 만나요.</p>
  <div class="stats">
    <div class="stat">
      <div class="stat-label">학습 단어</div>
      <div class="stat-value">{{ summary.learned }}<small> 개</small></div>
    </div>
    <div class="stat">
      <div class="stat-label">정답률</div>
      <div class="stat-value">{% if summary.rate is none %}-{% else %}{{ "%.1f"|format(summary.rate) }}<small> %</small>{% endif %}</div>
    </div>
    <div class="stat">
      <div class="stat-label">완벽 암기</div>
      <div class="stat-value">{{ mastery.mastered }}<small> 개</small></div>
    </div>
  </div>
  <p class="muted">복습 대기 {{ mastery.review_pending }}개</p>
  <a class="button primary large" href="{{ url_for('home') }}">홈으로</a>
</section>
{% endblock %}
