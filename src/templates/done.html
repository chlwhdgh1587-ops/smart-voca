{% extends "base.html" %}
{% block content %}
<h1>오늘의 학습 완료</h1>
<ul class="status">
  <li>학습 단어 <strong>{{ summary.learned }}</strong>개</li>
  <li>정답률 <strong>{% if summary.rate is none %}기록 없음{% else %}{{ "%.1f"|format(summary.rate) }} %{% endif %}</strong></li>
  <li>완벽 암기 <strong>{{ mastery.mastered }}</strong>개</li>
  <li>복습 대기 <strong>{{ mastery.review_pending }}</strong>개</li>
</ul>
<a class="button primary" href="{{ url_for('home') }}">홈으로</a>
{% endblock %}
