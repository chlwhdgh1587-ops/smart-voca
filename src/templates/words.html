{% extends "base.html" %}
{% block content %}
<h1>단어 관리</h1>

<section class="card">
  <h2>새 단어 등록</h2>
  <form method="post" action="{{ url_for('add_word_page') }}" class="word-form">
    <label>영어<input name="english" placeholder="예: approve" required></label>
    <label>뜻<input name="meaning" placeholder="예: 승인하다" required></label>
    <label>예문<input name="example" placeholder="예: The manager approved the plan."></label>
    <button type="submit" class="button primary">추가</button>
  </form>
</section>

<section class="card">
  <h2>단어 목록</h2>
  <p class="word-count">총 {{ words|length }}개</p>

  <div class="word-list-head">
    <span>영어</span><span>뜻</span><span>예문</span><span></span>
  </div>

  {% for word in words %}
  <div class="word-item">
    <form id="edit-{{ word.id }}" method="post" action="{{ url_for('edit_word_page', word_id=word.id) }}"></form>
    <form id="delete-{{ word.id }}" method="post" action="{{ url_for('delete_word_page', word_id=word.id) }}"
          onsubmit="return confirm('단어를 삭제하면 관련 학습 기록도 함께 삭제됩니다. 계속할까요?');"></form>
    <div class="word-row">
      <input form="edit-{{ word.id }}" name="english" value="{{ word.english }}" aria-label="영어" required>
      <input form="edit-{{ word.id }}" name="meaning" value="{{ word.meaning }}" aria-label="뜻" required>
      <input form="edit-{{ word.id }}" name="example" value="{{ word.example or '' }}" aria-label="예문">
      <div class="word-actions">
        <button type="submit" form="edit-{{ word.id }}" class="save">저장</button>
        <button type="submit" form="delete-{{ word.id }}" class="danger">삭제</button>
      </div>
    </div>
  </div>
  {% else %}
  <p class="muted">등록된 단어가 없습니다.</p>
  {% endfor %}
</section>
{% endblock %}
